name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout Calagopus 1.1.4 baseline
        uses: actions/checkout@v4
        with:
          repository: calagopus/panel
          ref: adc41d62ad40b0dc8afd5ffc089d1aa441dc0563
          path: panel

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml

      - name: Add extension to workspace
        run: |
          rsync -a extension/backend-extensions/team_voidvalue_tickets/ panel/backend-extensions/team_voidvalue_tickets/
          rsync -a extension/frontend/extensions/team_voidvalue_tickets/ panel/frontend/extensions/team_voidvalue_tickets/
          rsync -a extension/database/extension-migrations/team_voidvalue_tickets/ panel/database/extension-migrations/team_voidvalue_tickets/

      - name: Frontend
        working-directory: panel/frontend
        run: |
          pnpm install --frozen-lockfile=false
          pnpm build:ci

      - name: Rust formatting
        working-directory: panel
        run: cargo fmt --check -p team_voidvalue_tickets

      - name: Rust lint
        working-directory: panel
        run: cargo clippy -p team_voidvalue_tickets --all-targets -- -D warnings

      - name: Rust tests
        working-directory: panel
        run: cargo test -p team_voidvalue_tickets
